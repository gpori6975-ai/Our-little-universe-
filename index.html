<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey, My Love ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fffafa;
  color: #57232f;
  font-family: Georgia, serif;
  overflow-x: hidden;
}

.heart {
  position: fixed;
  bottom: -30px;
  color: #e94d70;
  pointer-events: none;
  animation: float 8s linear infinite;
  z-index: 0;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 0; }
  15% { opacity: .6; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

main {
  max-width: 600px;
  margin: auto;
  min-height: 100vh;
  padding: 24px 20px 45px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 1;
}

.card {
  background: white;
  border: 1px solid #f5d5dd;
  border-radius: 28px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 12px 45px #b72d4c12;
}

.top-heart {
  font-size: 45px;
  margin-bottom: 12px;
}

.tag {
  font: 11px Arial, sans-serif;
  letter-spacing: 3px;
  color: #d94c6c;
  text-transform: uppercase;
}

h1 {
  font-size: clamp(30px, 8vw, 43px);
  font-weight: normal;
  line-height: 1.2;
  margin: 18px 0;
  color: #9f233f;
}

p {
  font-size: 17px;
  line-height: 1.75;
}

.soft {
  color: #a36b79;
}

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  min-height: 100px;
  margin-top: 18px;
}

button {
  border: none;
  padding: 14px 23px;
  border-radius: 30px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: background .2s;
}

.yes {
  background: #d82f54;
  color: white;
  position: relative;
  z-index: 5;
  touch-action: manipulation;
}

.no {
  background: #fbe4eb;
  color: #92223e;
}

.next {
  background: #d82f54;
  color: white;
  margin-top: 12px;
}

.hidden {
  display: none !important;
}

#result {
  color: #9f233f;
  font-size: 18px;
  line-height: 1.8;
  margin-top: 22px;
  white-space: pre-line;
}

.progress {
  color: #bd788a;
  font: 11px Arial, sans-serif;
  letter-spacing: 2px;
  margin-bottom: 16px;
}

.signature {
  margin-top: 22px;
  color: #d82f54;
  font-style: italic;
  font-size: 20px;
}

footer {
  text-align: center;
  color: #bb8592;
  font: 10px Arial, sans-serif;
  letter-spacing: 2px;
  margin-top: 25px;
}

@media (max-width: 380px) {
  .card { padding: 26px 15px; }
  .buttons { gap: 10px; }
}
</style>
</head>

<body>

<span class="heart" style="left:8%;animation-delay:0s">♥</span>
<span class="heart" style="left:27%;animation-delay:3s">♡</span>
<span class="heart" style="left:76%;animation-delay:1s">♥</span>
<span class="heart" style="left:91%;animation-delay:5s">♡</span>

<main>
<div class="card">
  <div class="top-heart">❤️</div>
  <div class="tag">A tiny question for you</div>

  <div id="quiz">
    <div class="progress" id="progress">QUESTION 1 OF 6</div>
    <h1 id="question">Baby, are you angry with me? 🥺</h1>
    <p class="soft" id="hint">Choose honestly, Kuchu… 🤭</p>

    <div class="buttons" id="buttons">
      <button class="yes" id="yes" onclick="answerYes()">Yes 😒</button>
      <button class="no" id="no" onclick="answerNo()">No, baby ❤️</button>
    </div>
  </div>

  <div id="result" class="hidden"></div>
  <button id="next" class="next hidden" onclick="nextQuestion()">Next question 💌</button>
  <button id="restart" class="no hidden" onclick="restartQuiz()">Read again ❤️</button>

  <div class="signature">Made with love, just for you ♡</div>
</div>

<footer>YOUR GIRL · YOUR KUCHU · YOUR LITTLE LOVE STORY</footer>
</main>

<script>
const questions = [
  {
    q: "Baby, are you angry with me? 🥺",
    hint: "Choose honestly, Kuchu… 🤭",
    yes: "Okay, baby… I'll give you a little space. I'm here whenever you're ready to talk. ❤️",
    no: "Awww, come here then! 🥹❤️ I have some things to ask you.",
    runaway: true
  },
  {
    q: "Do you know that your little reactions can affect me? 🥹",
    hint: "Don't act innocent now, mister 🤭",
    yes: "Then please remember to be a little gentle with my heart, baby. I love you so much. 💗",
    no: "Well, now you know! My heart is a little sensitive when it comes to you. 🥺❤️"
  },
  {
    q: "When I get emotional, do you know why? 💌",
    hint: "Here's a tiny hint: it's you.",
    yes: "Exactly, baby. Your words matter to me because YOU matter to me. ❤️",
    no: "It's because I care about us, silly. I don't want to fight; I want us to understand each other. 🫶"
  },
  {
    q: "Would you listen to me even when I'm struggling to explain my feelings? 🥺",
    hint: "I promise I'll try to listen to you too.",
    yes: "That's all my heart wants sometimes: patience, understanding, and a little reassurance. 💗",
    no: "Aww, baby, let's try to be patient with each other. Both our feelings deserve to be heard. ❤️"
  },
  {
    q: "Do you know my favourite place to be? 🫣",
    hint: "Guess, my love…",
    yes: "Right where I feel loved, safe, and close to you. 🥹💕",
    no: "It's wherever I can be close to you and feel at peace. Now you know, mister! 🤭"
  },
  {
    q: "One last question, my Kuchu… will you keep choosing us? ❤️",
    hint: "Not just on easy days, but on the difficult ones too.",
    yes: "Come hereee! 🥹❤️ I don't need us to be perfect. I want us to keep learning, communicating, and caring for each other.",
    no: "I'll still hope we can keep choosing kindness and understanding. Love should feel safe for both of us. 💗"
  }
];

let current = 0;
let yesEscapes = 0;

const question = document.getElementById("question");
const hint = document.getElementById("hint");
const yesButton = document.getElementById("yes");
const noButton = document.getElementById("no");
const buttons = document.getElementById("buttons");
const result = document.getElementById("result");
const nextButton = document.getElementById("next");
const restartButton = document.getElementById("restart");
const progress = document.getElementById("progress");

function moveYes(event) {
  if (current !== 0) return;

  if (event) event.preventDefault();

  yesEscapes++;

  if (yesEscapes >= 5) {
    hint.textContent = "HAHAHA 🤭 the button is shy, just like you!";
    yesButton.style.transform = "none";
    yesButton.style.position = "relative";
    yesButton.style.left = "0";
    yesButton.style.top = "0";
    return;
  }

  const area = buttons.getBoundingClientRect();
  const maxX = Math.max(0, area.width - yesButton.offsetWidth);
  const maxY = 65;

  yesButton.style.position = "fixed";
  yesButton.style.left = Math.max(8, Math.random() * maxX + area.left) + "px";
  yesButton.style.top = Math.max(8, Math.random() * maxY + area.top) + "px";
}

yesButton.addEventListener("pointerenter", moveYes);
yesButton.addEventListener("touchstart", function(event) {
  if (current === 0) moveYes(event);
}, { passive: false });

function answerYes() {
  showAnswer("yes");
}

function answerNo() {
  showAnswer("no");
}

function showAnswer(type) {
  const item = questions[current];

  question.textContent = type === "yes" ? "A little message for you ❤️" : "A little message for you 💗";
  hint.classList.add("hidden");
  buttons.classList.add("hidden");
  progress.classList.add("hidden");

  result.textContent = item[type];
  result.classList.remove("hidden");

  if (current === questions.length - 1) {
    nextButton.classList.add("hidden");
    restartButton.classList.remove("hidden");
  } else {
    nextButton.classList.remove("hidden");
  }
}

function nextQuestion() {
  current++;

  const item = questions[current];

  question.textContent = item.q;
  hint.textContent = item.hint;
  hint.classList.remove("hidden");
  progress.textContent = "QUESTION " + (current + 1) + " OF " + questions.length;
  progress.classList.remove("hidden");
  buttons.classList.remove("hidden");
  result.classList.add("hidden");
  nextButton.classList.add("hidden");
  restartButton.classList.add("hidden");

  yesButton.textContent = "Yes ❤️";
  yesButton.style.position = "relative";
  yesButton.style.left = "0";
  yesButton.style.top = "0";
  yesButton.style.transform = "none";

  noButton.textContent = "No 🤭";
}

function restartQuiz() {
  current = 0;
  yesEscapes = 0;

  question.textContent = questions[0].q;
  hint.textContent = questions[0].hint;
  hint.classList.remove("hidden");
  progress.textContent = "QUESTION 1 OF " + questions.length;
  progress.classList.remove("hidden");
  buttons.classList.remove("hidden");
  result.classList.add("hidden");
  nextButton.classList.add("hidden");
  restartButton.classList.add("hidden");

  yesButton.textContent = "Yes 😒";
  noButton.textContent = "No, baby ❤️";
  yesButton.style.position = "relative";
  yesButton.style.left = "0";
  yesButton.style.top = "0";
}
</script>

</body>
</html>
